[tool.poetry]
name = "ptn-environment"
version = "0.1.0"
description = "ptn project"
authors = ["Nick Mazurkin <mazurkin@gmail.com>"]
readme = "README.md"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[tool.poetry.dependencies]
python = "3.12.12"

[tool.poetry.group.platform.dependencies]
setuptools = "80.3.1"

[tool.poetry.group.util.dependencies]
tqdm = "4.67.1"
tenacity = "8.2.3"
pydantic = "2.12.3"
loky = "3.5.6"
pyparsing = "3.2.3"
psutil = "7.1.3"
typer = "0.21.0"
joblib = "1.5.3"
argh = "0.29.4"

[tool.poetry.group.data-pandas.dependencies]
pandas = "2.3.3"
pandas-stubs = "2.3.3.251219"

[tool.poetry.group.pytorch.dependencies]
torch = {version = "2.6.0+cu124", source="pytorch"}
torchdata = {version = "0.7.1", source="pytorch"}

[tool.poetry.group.huggingface.dependencies]
huggingface_hub = {version = "0.36.0", extras=["cli"]}
transformers = {version = "4.57.3", extras=["torch"]}
sentence-transformers = "5.2.0"
datasets = "4.4.2"

[tool.poetry.group.llm.dependencies]
accelerate = "1.12.0"
peft = "0.18.0"
bitsandbytes = "0.49.0"
trl = "0.26.2"
sentencepiece = "0.2.1"
tiktoken = "0.12.0"
semchunk = "3.2.5"

[tool.poetry.group.tensorboard.dependencies]
tensorboard = "2.20.0"
tensorboard-plugin-profile = "2.21.3"

[tool.poetry.group.ngrok.dependencies]
ngrok = "1.7.0"

[tool.poetry.group.onyx.dependencies]
onnx = "1.18.0"

[tool.poetry.group.dev-lint.dependencies]
flake8 = "7.3.0"
pylint = "4.0.4"

[tool.poetry.group.dev-test.dependencies]
pytest = "8.4.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
